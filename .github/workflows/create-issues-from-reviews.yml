name: Create issues from PR reviews

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  test:
    name: Test review issue automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test .github/scripts/tests/create-issues-from-reviews.test.mjs

  create-issues:
    name: Create issues from PR reviews
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot
      - name: Generate review issue automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: read
      - name: Create issues from actionable findings
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/create-issues-from-reviews.mjs
