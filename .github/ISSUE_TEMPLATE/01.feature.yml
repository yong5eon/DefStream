name: 기능 제안
description: 추가하거나 개선할 기능을 제안합니다.
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: >
        해결하려는 문제와 제안하는 사용 경험을 중심으로 작성해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 제약이 있는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 기능과 기대하는 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 고려한 다른 방법이나 우회 방법이 있다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 예제, 참고 자료 등 제안의 맥락을 이해하는 데 도움이 되는 정보를 적어 주세요.
    validations:
      required: false
