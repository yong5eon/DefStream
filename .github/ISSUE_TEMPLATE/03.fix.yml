name: 변경 제안
description: 일반 변경이나 핫픽스의 목적과 범위를 정리합니다.
title: ""
labels:
  - fix
body:
  - type: markdown
    attributes:
      value: >
        일반 변경이나 긴급 수정이 필요한 핫픽스를 제안할 때 사용해 주세요.
        재현 가능한 기존 결함은 버그/오류 제보 양식을 이용해 주세요.
  - type: dropdown
    id: change_type
    attributes:
      label: 변경 유형
      description: 제안하는 변경의 성격을 선택해 주세요.
      options:
        - 일반 변경
        - 핫픽스
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 변경 목적
      description: 왜 이 변경이 필요한지, 해결하려는 불편이나 상황을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposed_changes
    attributes:
      label: 제안하는 변경 내용
      description: 무엇을 어떻게 바꾸면 좋을지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 영향 범위
      description: 영향을 받는 기능, 사용자, 호환성 또는 설정을 알고 있다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: hotfix_context
    attributes:
      label: 긴급 수정 정보
      description: 핫픽스인 경우 긴급한 이유, 영향받는 버전 및 임시 대응 방법을 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 기준
      description: 변경이 완료되었다고 판단할 수 있는 조건이나 검증 방법을 적어 주세요.
    validations:
      required: false
